[pytest]
testpaths = tests
pythonpath = . src
markers =
    integration: marks tests as integration (deselect with '-m "not integration"')
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince212
    ignore::DeprecationWarning:spacy.*
    ignore::DeprecationWarning:weasel.*
    ignore::DeprecationWarning:pydub.*
    ignore::UserWarning:torch.*
    ignore::FutureWarning:torch.*
    ignore:.*sample_size.*smaller than 64.*:FutureWarning
    ignore:.*__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning