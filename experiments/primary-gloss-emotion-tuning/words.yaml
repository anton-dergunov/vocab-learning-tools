# The word list this experiment runs both arms against.
#
# `source: real` rows are the owner's own reported failures, copied verbatim from
# `spoken_plans/loops-glosses.txt` — headword and current (bad) `primaryGloss`, as he found them
# while listening to generated loops. `source: synthetic` rows are authored for this experiment,
# because the owner's actual database (per his own count) likely holds only a handful of multi-word
# collocations with a too-short gloss, and real Chinese data is a single, unrepresentative word.
#
# Real production headwords beyond the five already reported still need pulling from the live
# database to (a) find more real multi-word-collocation candidates and (b) measure today's actual
# `emotion` null rate on a genuinely random sample, rather than guessing at "5% or maybe 10%". That
# extraction is blocked for now — see the experiment README's "Data access" section — so `category:
# emotion_random` below is a synthetic stand-in for the real random sample the plan calls for, not a
# replacement for it.
#
# No synthetic collocation below reuses a word from `arms/after.md`'s own worked examples
# (`el disfraz`, `tocar la guitarra`, `dar un paseo`, `quedarse dormido`, `el domingo`, `el lunes`,
# a chair, `de`, `and`) — compose-lesson-line's own pilot got contaminated exactly this way and had
# to fix it before spending money.

vocabularies:
  es: {language: es, definitionLang: es, glossLangs: [en], notesLang: en}
  en: {language: en, definitionLang: en, glossLangs: [ru], notesLang: ru}
  zh-Hans: {language: zh-Hans, definitionLang: en, glossLangs: [ru, en], notesLang: ru}

topics: [Emotions, Actions, Nature, Culture, Food, Health, Appearance, Technology, Travel, Slang, Social, Places, Misc]

