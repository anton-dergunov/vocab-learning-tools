<!-- What a cold start shows while the replica is read back from the device: the wordmark, and a
     note that fades in only if opening takes a moment. Never the interface with no words in it. -->
<div class="launch" role="status">
  <p class="launch-mark">Acervo</p>
  <p class="launch-note">Opening your vocabulary…</p>
</div>
</body>
