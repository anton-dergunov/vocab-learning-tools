      timeout_seconds: 3600

  sana_sprint_06b:
    label: Sana Sprint 0.6B (experimental MPS)
    provider: diffusers
    model: Efficient-Large-Model/Sana_Sprint_0.6B_1024px_diffusers
    enabled: false
    output_extension: png
    command: *diffusers_command
    settings:
      width: 512
