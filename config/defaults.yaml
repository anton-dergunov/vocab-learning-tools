vocabulary:
  # Target language for processing
  language: "Spanish"

  # Available categories for vocabulary classification
  topics:
    - "Emotions"
    - "Actions"
    - "Nature"
    - "Culture"
    - "Food"
    - "Health"
    - "Appearance"
    - "Technology"
    - "Travel"
    - "Slang"
    - "Misc"

files:
  # Source file containing new vocabulary entries
  inbox: "data/Spanish vocab - Inbox.md"

  # Destination pattern for categorized vocabulary (%topic = placeholder)
  output_pattern: "data/Spanish vocab - %topic.md"

llm:
  # Provider used unless --llm-provider is passed.
  default_provider: "gemini"

  # Shared prompt. A provider may override this with its own prompt_path.
  prompt_path: "prompts/vocabulary_prompt_template.txt"

  providers:
    gemini:
      options:
        model: "gemini-flash-latest"
        model_params: {}
        rate_limit_per_minute: 10

    ollama:
      # Add prompt_path here if the local model needs a different prompt.
      # prompt_path: "prompts/vocabulary_prompt_ollama.txt"
      options:
        model: "gemma3:4b"
        model_params: {}
        rate_limit_per_minute: 60

processing:
  # Items to process per batch
  batch_size: 1

  # Display the new vocabulary items
  show_items: true

tts:
  # Text-to-speech service
  provider: "kokoro"
  options:
    lang_code: "e"
    voice: "ef_dora"
    # speed: 1.0
    # device: "mps"

image:
  # Image generation service
  provider: "stable_diffusion"
  options:
    model_id: "dreamlike-art/dreamlike-photoreal-2.0"
    width: 384
    height: 384
    device: "mps"
