llm:
  default_provider: "gemini"
  providers:
    gemini:
      options:
        model: "gemini-flash-latest"
        model_params: {}
        rate_limit_per_minute: 10

    ollama:
      options:
        model: "gemma3:4b"
        model_params: {}
        rate_limit_per_minute: 60

tts:
  # Text-to-speech service
  provider: "kokoro"
  options:
    lang_code: "e"
    voice: "ef_dora"
    # speed: 1.0
    # device: "mps"

image:
  # Image generation service
  provider: "stable_diffusion"
  options:
    model_id: "dreamlike-art/dreamlike-photoreal-2.0"
    width: 384
    height: 384
    # "auto" selects MPS, then CUDA, then CPU.
    device: "auto"
    # generation_params:
    #   num_inference_steps: 50
    #   guidance_scale: 7.5
