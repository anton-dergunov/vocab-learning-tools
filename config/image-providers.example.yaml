# Provisional production profiles from the phase-1 research. These are examples
# only; config/defaults.yaml and vocabgen.vision remain unchanged until review.
image:
  default_provider: mflux_flux2_klein_q4
  output:
    width: 384
    height: 384
    format: webp
    quality: 88
  providers:
    mflux_flux2_klein_q4:
      provider: mflux
      options:
        model_id: black-forest-labs/FLUX.2-klein-4B
        quantize: 4
        width: 512
        height: 512
        num_inference_steps: 4
        guidance: 1.0
    cloudflare_flux2_klein:
      provider: cloudflare_workers_ai
      options:
        model_id: "@cf/black-forest-labs/flux-2-klein-4b"
        account_id_env: CLOUDFLARE_ACCOUNT_ID
        token_env: CLOUDFLARE_API_TOKEN
        width: 512
        height: 512
        guidance: 1.0
    gemini_flash_lite_image:
      provider: gemini_vertex_image
      options:
        model: gemini-3.1-flash-lite-image
        project_env: GOOGLE_CLOUD_PROJECT
        location_env: GOOGLE_CLOUD_LOCATION
        location: global
    icon_scene:
      provider: deterministic_icon_scene
      options:
        planner_llm_provider: gemini
        schema_version: 1
        width: 512
        height: 512
        icon_collections: [material-symbols, noto-emoji]
  fallback_order:
    - selected_provider
    - icon_scene
    - article_emoji
