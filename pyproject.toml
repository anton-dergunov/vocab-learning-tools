[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acervo"
version = "0.1.0"
description = "Acervo — a personal vocabulary store and the pipelines that feed it"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Kept in step with requirements/core.txt, which is what the containers install.
dependencies = [
    "google-auth>=2.40",
    "google-genai>=2.19.0",
    "httpx>=0.28",
    "litellm>=1.100",
    "pillow>=12.3.0",
    "pydantic>=2,<3",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
anki = ["anki==26.8.1"]
dictionaries = ["pyglossary==5.4.2", "lxml"]
benchmark = ["cairosvg>=2.9.0"]
# Kept in step with requirements/server.txt, which is what the server image installs.
server = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi>=0.121",
    "pyjwt>=2.10",
    "pydantic-settings>=2.7",
    "soundfile>=0.13",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acervo = ["py.typed"]
