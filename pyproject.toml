[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acervo"
version = "0.1.0"
description = "Acervo — a personal vocabulary store and the pipelines that feed it"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Kept in step with requirements/core.txt, which is what the containers install.
dependencies = [
    "google-genai>=2.19.0",
    "pillow>=12.3.0",
    "pydantic>=2,<3",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
anki = ["anki==26.8.1"]
dictionaries = ["pyglossary==5.4.2", "lxml"]
benchmark = ["cairosvg>=2.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acervo = ["py.typed"]
