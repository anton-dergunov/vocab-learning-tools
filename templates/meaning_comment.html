<div class="image">
    <img src="{{ media.image_name }}" alt="{{ meaning.example.image_prompt }}">
</div>

<div class="audio">
    [sound:{{ media.audio_name }}] Listen to pronunciation
</div>

<div class="comment"><strong>Word meaning:</strong> {{meaning.meaning}}</div>

{% if meaning.example.comment %}
<div class="comment">{{ meaning.example.comment }}</div>
{% endif %}

<div class="note">
Word: <strong>{{data.word}}</strong> — {{data.translation}}
</div>
