name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Fetch the pinned spoken-usage-retrieval artifacts
      # web/package.json depends on the retrieval player by its versioned tarball path, so a clean
      # checkout cannot `npm install` until the artifacts are on disk. vendor/ is gitignored on
      # purpose — the pin is what is tracked, not the bytes. Digests are verified against
      # deploy/acervo/speech/pin.json.
      run: ./scripts/fetch_speech.sh

    - name: Fetch the pinned lexibeat wheel
      # The loop image COPYs it out of vendor/. Only the wheel: the pin also names a ~3.1 GB sample
      # bundle, which is fetched once on the server and has no business in a CI checkout.
      run: ./scripts/fetch_lexibeat.sh

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt
        pip install -e .
        npm install --prefix web

    - name: Stage the Acervo PWA
      run: npm run stage:pwa

    - name: Run unit tests
      run: |
        pytest -v -m "not integration"

  anki-sync-docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Fetch the pinned spoken-usage-retrieval artifacts
      # web/package.json depends on the retrieval player by its versioned tarball path, so a clean
      # checkout cannot `npm install` until the artifacts are on disk. vendor/ is gitignored on
      # purpose — the pin is what is tracked, not the bytes. Digests are verified against
      # deploy/acervo/speech/pin.json.
      run: ./scripts/fetch_speech.sh

    - name: Fetch the pinned lexibeat wheel
      run: ./scripts/fetch_lexibeat.sh

    - name: Install web dependencies
      run: npm install --prefix web

    - name: Install test runner
      run: python -m pip install pytest

    - name: Validate official Anki server and robot
      env:
        RUN_DOCKER_INTEGRATION_TESTS: 'true'
        ACERVO_EVIDENCE_DIR: build/anki-sync-evidence/ci
      run: pytest -v -s tests/integration/test_anki_sync_docker.py

    - name: Upload validation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: anki-sync-docker-evidence
        path: build/anki-sync-evidence/ci
        if-no-files-found: warn

  multi-arch-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image:
          - deploy/acervo/server/Dockerfile
          - deploy/acervo/Dockerfile
          - deploy/acervo/speech/Dockerfile
          - deploy/acervo/lexibeat/Dockerfile

    steps:
    - uses: actions/checkout@v4

    - name: Fetch the pinned spoken-usage-retrieval artifacts
      # The speech image COPYs the wheel out of vendor/, and compose builds from the extracted
      # release root where it is present. Cheap for the other images and keeps one step list.
      run: ./scripts/fetch_speech.sh

    - name: Fetch the pinned lexibeat wheel
      run: ./scripts/fetch_lexibeat.sh

    - name: Enable emulated ARM64 builds
      uses: docker/setup-qemu-action@v3

    - name: Configure Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build AMD64 and ARM64 production images
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.image }}
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
