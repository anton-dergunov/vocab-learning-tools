name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt
        npm install --prefix web

    - name: Stage the Acervo PWA
      run: npm run stage:pwa

    - name: Run unit tests
      run: |
        pytest -v -m "not integration"

  anki-sync-docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install web dependencies
      run: npm install --prefix web

    - name: Install test runner
      run: python -m pip install pytest

    - name: Validate official Anki server and robot
      env:
        RUN_DOCKER_INTEGRATION_TESTS: 'true'
        ACERVO_EVIDENCE_DIR: build/anki-sync-evidence/ci
      run: pytest -v -s tests/integration/test_anki_sync_docker.py

    - name: Upload validation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: anki-sync-docker-evidence
        path: build/anki-sync-evidence/ci
        if-no-files-found: warn

  anki-sync-multi-arch-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Enable emulated ARM64 builds
      uses: docker/setup-qemu-action@v3

    - name: Configure Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build AMD64 and ARM64 production images
      uses: docker/build-push-action@v6
      with:
        context: .
        file: deploy/acervo/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
