<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Acervo">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b83b43"/>
      <stop offset=".48" stop-color="#92232e"/>
      <stop offset="1" stop-color="#64131f"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a101b"/>
      <stop offset=".55" stop-color="#8d202b"/>
      <stop offset="1" stop-color="#b43a42"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c9"/>
      <stop offset="1" stop-color="#dca957"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset=".45" stop-color="#f4bd4c"/>
      <stop offset="1" stop-color="#c77a18"/>
    </linearGradient>
  </defs>

  <!-- Back cover and its soft navy shadow establish a compact book silhouette. -->
  <path d="M4.2 7.4 23.6 3.1q2.8-.6 3.3 2.2l3.6 18.1q.5 2.4-1.9 3L9.3 31q-2.6.6-3.1-2L2.3 10.8q-.6-2.7 1.9-3.4Z" fill="#071a38" opacity=".42"/>
  <path d="M5 6.4 24.1 2.2q2.6-.6 3.1 2l3.5 17.7q.5 2.4-1.8 2.9L9.5 29.3q-2.5.5-3-1.9L2.8 9.7Q2.3 7 5 6.4Z" fill="url(#cover)" stroke="#5a101b" stroke-width="1.15" stroke-linejoin="round"/>

  <!-- The cream fore-edge and lower edge make this unmistakably a closed book. -->
  <path d="m7 7.7 17.3-3.8 3.4 17.2-17.5 4.1Z" fill="url(#pages)" stroke="#9b5c24" stroke-width=".85" stroke-linejoin="round"/>
  <path d="m10.2 23.3 17.5-4.1.4 1.9-17.5 4.1Z" fill="#fff0c4"/>
  <path d="m11.1 23.8 16.6-3.9M11.6 25l16.3-3.8" fill="none" stroke="#c78a3d" stroke-width=".55" stroke-linecap="round" opacity=".85"/>

  <!-- Front cover, with a softly modelled spine and a single embossed initial. -->
  <path d="M4.1 3.6 23.2.2q2.4-.4 2.9 2l3.4 16.9q.4 2.2-1.9 2.7L8.5 26q-2.4.5-2.9-1.8L2.1 7q-.6-2.9 2-3.4Z" fill="url(#cover)" stroke="#e4a13a" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M4.1 3.6 8 2.9l4.6 21.9-4.1 1.1q-2.4.5-2.9-1.8L2.1 7q-.6-2.9 2-3.4Z" fill="url(#spine)"/>
  <path d="m8 2.9 4.6 21.9" fill="none" stroke="#e3a03a" stroke-width=".9" opacity=".8"/>

  <!-- Wide counters and strokes are tuned to stay legible at 16 px. -->
  <path d="m17.2 5.4 8.6 13.7-3.2.7-1.5-2.6-5.2 1.1-.4 3-3.2.7 2.2-16Zm-1 9.8 3.5-.8-2.8-5Z" fill="url(#gold)" fill-rule="evenodd" stroke="#7b3713" stroke-width=".45" stroke-linejoin="round"/>
</svg>
