services:
  # The Acervo server: one Python service that owns the graph, capture, the dictionary routes and
  # the interface itself.
  server:
    build:
      context: ../..
      dockerfile: deploy/acervo/server/Dockerfile
    restart: unless-stopped
    user: "${ACERVO_UID:-1000}:${ACERVO_GID:-1000}"
    environment:
      ACERVO_APP_VERSION: "${ACERVO_APP_VERSION:-}"
      ACERVO_APP_BUILD: "${ACERVO_APP_BUILD:-}"
      ACERVO_DB_PATH: /var/lib/acervo/server/acervo.db
      ACERVO_JWT_SECRET: "${ACERVO_JWT_SECRET:-}"
      ACERVO_DOWNLOADS_PATH: /var/lib/acervo/downloads
      ACERVO_DICTIONARIES_PATH: /var/lib/acervo/dictionaries
      ACERVO_MEDIA_PATH: /var/lib/acervo/media
      ACERVO_PROMPTS_PATH: /app/prompts
      # Which providers answer, in order, as ids from models/catalogue.json. Unset means every one
      # this deployment has credentials for, in catalogue order — so a server with one key needs
      # nothing here. The keys themselves are named by their catalogue rows, and every value comes
      # from llm.env, which the installer writes mode 600 and compose passes last.
      ACERVO_TEXT_CHAIN: "${ACERVO_TEXT_CHAIN:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      ACERVO_OLLAMA_URL: "${ACERVO_OLLAMA_URL:-}"
      # Vertex authenticates by application default credentials, not by a key: LiteLLM has no
      # express-key path. Without GOOGLE_APPLICATION_CREDENTIALS pointing at a service-account file
      # mounted into the container, the vertex row is simply unavailable and health says so.
      ACERVO_VERTEX_PROJECT: "${ACERVO_VERTEX_PROJECT:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      # Optional guard: the account those credentials must belong to, or the row refuses to run.
      ACERVO_VERTEX_ACCOUNT: "${ACERVO_VERTEX_ACCOUNT:-}"
    ports:
      - "${ACERVO_APP_BIND_ADDRESS:-127.0.0.1}:${ACERVO_APP_PORT:-27702}:8000"
    volumes:
      - "${ACERVO_SERVER_DATA:-acervo-server-data}:/var/lib/acervo/server"
      - "${ACERVO_DOWNLOADS:-acervo-downloads}:/var/lib/acervo/downloads:ro"
      - "${ACERVO_DICTIONARIES:-acervo-dictionaries}:/var/lib/acervo/dictionaries:ro"
      # Read-write, unlike the dictionaries beside it: the server draws sense images now, and the
      # file and the row that names it have to be written by the same party. Dictionaries stay
      # read-only because nothing but the worker ever compiles one.
      - "${ACERVO_MEDIA:-acervo-media}:/var/lib/acervo/media"
      # Google will not authenticate from an environment variable: Vertex wants a credentials
      # file, and LiteLLM has no express-key path. The directory is mounted rather than the
      # file so the mount is valid whether or not one has been configured.
      - "${ACERVO_CREDENTIALS:-acervo-credentials}:/run/acervo/credentials:ro"
    healthcheck:
      # Asserts an HTTP 200, not a TCP connect: a service that is listening but refusing every
      # request is not healthy. `wget` is deliberately not used — the alpine image had it and
      # python:3.12-slim does not, and a container whose healthcheck binary is missing reports
      # unhealthy forever while serving perfectly.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/acervo/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  anki-sync-server:
    build:
      context: ../..
      dockerfile: deploy/acervo/Dockerfile
      args:
        ANKI_VERSION: "${ACERVO_ANKI_VERSION:-26.8.1}"
    restart: unless-stopped
    user: "${ACERVO_UID:-1000}:${ACERVO_GID:-1000}"
    command: ["python", "-m", "anki.syncserver"]
    environment:
      SYNC_USER1: "${ACERVO_ANKI_SYNC_USERNAME:?Set ACERVO_ANKI_SYNC_USERNAME}:${ACERVO_ANKI_SYNC_PASSWORD:?Set ACERVO_ANKI_SYNC_PASSWORD}"
      SYNC_BASE: /var/lib/acervo/anki-server
      SYNC_HOST: 0.0.0.0
      SYNC_PORT: "8080"
      RUST_LOG: "${ACERVO_ANKI_LOG_LEVEL:-anki=info}"
    ports:
      - "${ACERVO_BIND_ADDRESS:-127.0.0.1}:${ACERVO_ANKI_PORT:-27701}:8080"
    volumes:
      - "${ACERVO_ANKI_SERVER_DATA:?Set ACERVO_ANKI_SERVER_DATA}:/var/lib/acervo/anki-server"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Acervo's own server-side work. Not a running service: `profiles: ["tools"]` means it exists to
  # be started by `docker compose run --rm`, do one job, and exit. A new job is a new subcommand of
  # acervo_worker.py, never a new container.
  acervo-worker:
    build:
      context: ../..
      dockerfile: deploy/acervo/Dockerfile
      args:
        ANKI_VERSION: "${ACERVO_ANKI_VERSION:-26.8.1}"
    profiles: ["tools"]
    user: "${ACERVO_UID:-1000}:${ACERVO_GID:-1000}"
    entrypoint: ["python", "/app/scripts/acervo_worker.py"]
    environment:
      ACERVO_ANKI_SYNC_ENDPOINT: "http://anki-sync-server:8080/"
      ACERVO_ANKI_SYNC_USERNAME: "${ACERVO_ANKI_SYNC_USERNAME:?Set ACERVO_ANKI_SYNC_USERNAME}"
      ACERVO_ANKI_SYNC_PASSWORD: "${ACERVO_ANKI_SYNC_PASSWORD:?Set ACERVO_ANKI_SYNC_PASSWORD}"
      ACERVO_ANKI_COLLECTION: /var/lib/acervo/worker/collection.anki2
      ACERVO_ANKI_BACKUP_DIR: /var/lib/acervo/worker/backups
      ACERVO_ANKI_TEMPLATE_DIR: /app/templates
      # Compiled dictionaries are written here and served read-only by the server. The downloaded
      # sources stay in the worker's own data directory and are never exposed.
      ACERVO_DICTIONARIES_PATH: /var/lib/acervo/dictionaries
      ACERVO_MEDIA_PATH: /var/lib/acervo/media
      ACERVO_DICTIONARY_CACHE: /var/lib/acervo/worker/dictionary-sources
      # A job's write path is a client's write path: it signs in over POST /session like any other
      # client and goes through the graph route, so it gets the same validation and the same revision
      # allocation as a phone. The credential is the owner's *own* account, not a service account —
      # every record is owner-scoped and a cross-owner reference is refused, so a second account
      # could not write against the owner's lexemes at all. Deliberately not ACERVO_JWT_SECRET:
      # that signs every account's tokens, and a batch job has no business holding it.
      ACERVO_SERVER_URL: "${ACERVO_SERVER_URL:-http://server:8000}"
      ACERVO_OWNER_EMAIL: "${ACERVO_OWNER_EMAIL:-}"
      ACERVO_OWNER_PASSWORD: "${ACERVO_OWNER_PASSWORD:-}"
      # Which providers answer, in order, as ids from models/catalogue.json. Unset means every one
      # this deployment has credentials for, in catalogue order — so a server with one key needs
      # nothing here. The keys themselves are named by their catalogue rows, and every value comes
      # from llm.env, which the installer writes mode 600 and compose passes last.
      ACERVO_TEXT_CHAIN: "${ACERVO_TEXT_CHAIN:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      ACERVO_OLLAMA_URL: "${ACERVO_OLLAMA_URL:-}"
      # Vertex authenticates by application default credentials, not by a key: LiteLLM has no
      # express-key path. Without GOOGLE_APPLICATION_CREDENTIALS pointing at a service-account file
      # mounted into the container, the vertex row is simply unavailable and health says so.
      ACERVO_VERTEX_PROJECT: "${ACERVO_VERTEX_PROJECT:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      # Optional guard: the account those credentials must belong to, or the row refuses to run.
      ACERVO_VERTEX_ACCOUNT: "${ACERVO_VERTEX_ACCOUNT:-}"
    volumes:
      - "${ACERVO_WORKER_DATA:?Set ACERVO_WORKER_DATA}:/var/lib/acervo/worker"
      - "${ACERVO_DICTIONARIES:-acervo-dictionaries}:/var/lib/acervo/dictionaries"
      - "${ACERVO_MEDIA:-acervo-media}:/var/lib/acervo/media"
      - "${ACERVO_INPUT_PATH:?Set ACERVO_INPUT_PATH}:/input:ro"
      - "${ACERVO_CREDENTIALS:-acervo-credentials}:/run/acervo/credentials:ro"
    depends_on:
      anki-sync-server:
        condition: service_healthy
    # Deliberately *not* depending on `server`. Only `anki pull-state` writes through it, and a
    # dependency here applies to every `run --rm` — it would build and start the whole API service to
    # compile a dictionary, and drag it into tests that have nothing to do with it. In production the
    # server is `restart: unless-stopped` and already up; when it is not, the client says so in
    # exactly those words rather than hanging.

volumes:
  acervo-server-data:
  acervo-downloads:
  acervo-dictionaries:
  acervo-media:
